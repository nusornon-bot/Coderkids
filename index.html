    <script>
      // Intercept benign Vite HMR WebSocket and third-party browser extension errors (e.g. MetaMask inpage.js)
      (function () {
        function isIgnorableExternalError(msg, stack, filename) {
          var combined = (msg || '') + ' ' + (stack || '') + ' ' + (filename || '');
          return (
            combined.indexOf('WebSocket') !== -1 ||
            combined.indexOf('websocket') !== -1 ||
            combined.indexOf('MetaMask') !== -1 ||
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1
          );
        }
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            var stack = (reason && reason.stack) || '';
            if (isIgnorableExternalError(msg, stack, '')) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (e) {
            var msg = (e.message || '') + '';
            var stack = (e.error && e.error.stack) || '';
            var filename = (e.filename || '') + '';
            if (isIgnorableExternalError(msg, stack, filename)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
